apply from: 'gradle/scripts/helpers.gradle'

repositories {
    // Other repositories described by default:
    // CleanroomMC: https://maven.cleanroommc.com
    exclusiveContent {
        forRepository {
            maven {
                name 'CleanroomMC CurseMaven'
                url 'https://curse.cleanroommc.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name 'Modrinth'
                url 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    mavenLocal() // Must be last for caching to work
}

dependencies {
    implementation "com.cleanroommc:strip-latest-forge-requirements:1.0"
    compileOnly 'org.jetbrains:annotations:24.1.0'

    implementation rfg.deobf('curse.maven:had-enough-items-557549:4543375')
    implementation rfg.deobf('curse.maven:baubles-227083:2518667')
    implementation rfg.deobf("vazkii.patchouli:Patchouli:1.0-23.6")
    implementation rfg.deobf("curse.maven:the-one-probe-245211:2667280")

    implementation "CraftTweaker2:CraftTweaker2-API:4.1.20.695"
    implementation "CraftTweaker2:ZenScript:4.1.20.695"
    implementation "CraftTweaker2:CraftTweaker2-MC1120-Main:1.12-4.1.20.695"
    implementation("com.cleanroommc:groovyscript:1.2.2") { transitive = false }

    // Mod Integrations
    def modMap = [:]
    def loadMap = [:]
    modMap.put(["curse.maven:blood-magic-224791:2822288", "curse.maven:guide-api-228832:2645992"], project.bloodmagic)
    modMap.put(["curse.maven:botania-225643:3330934"], project.botania)
    modMap.put(["curse.maven:embers-rekindled-300777:3695248"], project.embers)
    modMap.put(["curse.maven:immersive-engineering-231951:2974106"], project.immersiveengineering)
    modMap.put(["curse.maven:magiculture-integrations-1064613:6905883", "curse.maven:configanytime-870276:5212709"], project.magicultureintegrations)
    modMap.put(["curse.maven:natures-aura-306626:2882138"], project.naturesaura)
    modMap.put(["curse.maven:simpledifficulty-360779:3613814"], project.simpledifficulty)
    modMap.put(["curse.maven:thaumcraft-223628:2629023"], project.thaumcraft)
    modMap.put(["curse.maven:tough-as-nails-246391:2639903"], project.toughasnails)
    modMap.put(["curse.maven:waterskin-simple-difficulty-619774:3776463", "curse.maven:simpledifficulty-360779:3613814"], project.waterskinSD)
    modMap.put(["curse.maven:waterskin-441560:3191584", "curse.maven:tough-as-nails-246391:2639903"], project.waterskinTAN)


    modMap.each{mods, load -> {
        boolean loadFlag = load.toBoolean()
        mods.each{mod ->
            if(!loadMap.containsKey(mod)) {
                loadMap.put(mod,loadFlag)
            } else {
                if(loadFlag && !loadMap[mod]) {
                    loadMap[mod] = loadFlag
                }
            }
        }
    }}

    loadMap.each{maven,load -> {
        if(load) {
            implementation(rfg.deobf(maven))
        } else {
            compileOnly(rfg.deobf(maven))
        }
    }}
}